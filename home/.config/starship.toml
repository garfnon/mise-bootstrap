#"$schema" = 'https://starship.rs/config-schema.json'
#
## Layout mirrors the old p10k setup: dir + git, newline, prompt char on the left;
## status/duration/jobs/cloud context on the right. Only modules listed here render,
## so language-version modules (node, go, python, ...) stay out of the prompt.
#format = """$directory$git_branch$git_state$git_status$line_break$character"""
#right_format = """$status$cmd_duration$jobs$direnv$kubernetes$aws$gcloud$azure$terraform"""
#
#command_timeout = 1000
#
#[character]
#success_symbol = '[❯](bold green)'
#error_symbol = '[❯](bold red)'
#
#[directory]
#truncation_length = 4
#truncate_to_repo = false
#format = '[ $path]($style)[$read_only]($read_only_style) '
#read_only = ' 󰌾'
#
#[status]
#disabled = false
#format = '[$symbol$status]($style) '
#
#[cmd_duration]
#min_time = 3_000
#format = '[$duration]($style) '
#
#[direnv]
#disabled = false
#format = '[$loaded]($style) '

"$schema" = 'https://starship.rs/config-schema.json'

# Same segments and order as the old powerline layout, without the coloured blocks and
# arrow separators: plain foreground colours from the terminal palette, space-separated.
# First line, right-aligned via $fill: kube context (kubie's own prompt is disabled
# in ~/.kube/kubie.yaml), then the AWS profile picked with `awsp`.
format = """
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$pixi\
$fill\
$kubernetes\
${env_var.AWSP_LABEL}\
$line_break$character"""

# Clock sits at the right edge of the input line (zsh RPROMPT).
right_format = """$time"""

[directory]
style = "bold cyan"
format = "[ $path ]($style)"
truncation_length = 3
# Count from the cwd, not the repo root, so three levels show inside git repos too
truncate_to_repo = false
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "purple"
format = '[$symbol $branch ]($style)'

[git_status]
style = "red"
format = '[($all_status$ahead_behind )]($style)'

[nodejs]
symbol = ""
style = "blue"
format = '[$symbol( $version) ]($style)'

[bun]
symbol = ""
style = "blue"
format = '[$symbol( $version) ]($style)'

[c]
symbol = " "
style = "blue"
format = '[$symbol( $version) ]($style)'

[cpp]
symbol = " "
style = "blue"
format = '[$symbol( $version) ]($style)'

[rust]
symbol = ""
style = "blue"
format = '[$symbol( $version) ]($style)'

[golang]
symbol = ""
style = "blue"
format = '[$symbol( $version) ]($style)'

[php]
symbol = ""
style = "blue"
format = '[$symbol( $version) ]($style)'

[java]
symbol = ""
style = "blue"
format = '[$symbol( $version) ]($style)'

[kotlin]
symbol = ""
style = "blue"
format = '[$symbol( $version) ]($style)'

[haskell]
symbol = ""
style = "blue"
format = '[$symbol( $version) ]($style)'

[python]
symbol = ""
style = "blue"
format = '[$symbol( $version) ]($style)'

[docker_context]
symbol = ""
style = "cyan"
format = '[$symbol( $context) ]($style)'

[conda]
style = "cyan"
format = '[$symbol( $environment) ]($style)'

[pixi]
style = "cyan"
format = '[$symbol( $version)( $environment) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bright-black"
format = '[ $time ]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold green)'
error_symbol = '[](bold red)'
vimcmd_symbol = '[](bold green)'
vimcmd_replace_one_symbol = '[](bold purple)'
vimcmd_replace_symbol = '[](bold purple)'
vimcmd_visual_symbol = '[](bold yellow)'

# Kube context is always shown (Starship can't do p10k's show-on-typing-kubectl).
# Context names embed the Odyssey stack name; show just the stack and colour by risk.
# First matching entry wins.
[kubernetes]
disabled = false
symbol = '󱃾 '
# Coloured icon, no background, one space before the text.
# The context text keeps the per-context risk style below.
format = '[󱃾 ](bold blue)[$context( \($namespace\))]($style) '

[[kubernetes.contexts]]  # production — any auth level
context_pattern = '.*?(?P<stack>[agz](?:us|uk|nt)g?[ecwns]\d-(?:com|il2|il4|il5|frm|frh|rc|rh)-p-[\w-]+?)-main.*'
context_alias = 'PROD $stack'
style = 'bold white bg:red'

[[kubernetes.contexts]]  # restricted auth level, non-prod
context_pattern = '.*?(?P<stack>[agz](?:us|uk|nt)g?[ecwns]\d-(?:il4|il5|frh|rh)-[dsv]-[\w-]+?)-main.*'
context_alias = '$stack'
style = 'bold yellow'

[[kubernetes.contexts]]  # non-stack contexts that still look like prod
context_pattern = '.*(?:^|[-_/])(?:prd|prod)(?:[-_/]|$).*'
style = 'bold white bg:red'

[[kubernetes.contexts]]  # everything else that looks like a stack
context_pattern = '.*?(?P<stack>[agz](?:us|uk|nt)g?[ecwns]\d-(?:com|il2|il4|il5|frm|frh|rc|rh)-[dsvp]-[\w-]+?)-main.*'
context_alias = '$stack'
style = 'cyan'

[aws]
format = '[$symbol($profile )(\($region\) )]($style)'

[azure]
disabled = false

[env_var.AWSP_LABEL]
variable = "AWSP_LABEL"
format = '[ ](bold yellow)[$env_value]($style) '
style = "bold yellow"

[fill]
symbol = " "
