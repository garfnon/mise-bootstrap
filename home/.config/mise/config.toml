# Global mise config. Managed by ~/git/bootstrap -- edit there, then `mise run link`.
#
# Only tools where the exact version matters live here: infrastructure CLIs that
# have to match a cluster, a state file or a project (and get pinned per project
# with a local mise.toml), plus language runtimes. Everything else -- general CLI
# tools, the GNU/uutils userland, casks -- is installed by Homebrew from the
# Brewfile alongside this repo, which always tracks the latest release.

[tools]
go = "1.27.3"
flux2 = "2.9.6"
helm = "4.3.1"
istioctl = "1.31.3"
kubectl = "1.35"
kustomize = "5.8.1"
node = "26.12.1"
opentofu = "1.13.2" 
packer = "1.16.2"
pulumi = "3.272.0"
terraform = "1.16.7"
terragrunt = "1.1.4"
