font_family postscript_name=BerkeleyMono-RetinaSemiCondensed
bold_font postscript_name=BerkeleyMono-BoldSemiCondensed
# kitty clips slanted glyphs at the cell edge, so italics are a lighter upright weight instead (ghostty gets the real obliques)
italic_font postscript_name=BerkeleyMono-LightSemiCondensed
bold_italic_font postscript_name=BerkeleyMono-SemiBoldSemiCondensed

font_size 15
disable_ligatures never

enabled_layouts all
copy_on_select yes
clipboard_control write-clipboard write-primary read-clipboard read-primary
skip_trailing_spaces smart
draw_minimal_borders yes

tab_bar_edge top
tab_bar_style powerline
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_separator " ::"
tab_title_template "{title}"

allow_remote_control yes

remember_window_size yes
window_padding_width 10
scrollback_lines 100000

map ctrl+f launch --type=overlay --stdin-source=@screen_scrollback $HOME/.nix-profile/bin/fzf --no-sort --no-mouse --exact -i
map f1 launch --allow-remote-control kitten broadcast --match-tab state:focused
enable_audio_bell no


# BEGIN_KITTY_THEME
# Solarized Osaka
include current-theme.conf
# END_KITTY_THEME

# near-black with a faint teal tint, instead of the theme's blue background
background #090c0d
#background_opacity 0.8
background_image /Users/rrao/Pictures/a9061e6fgy1hz89avkhdhj22yo1z44qp.jpg
background_image_layout scaled
background_tint         0.97

active_border_color     #44ffff
single_window_margin_width 0
